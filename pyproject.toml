[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallpaper-cli"
version = "0.2.0"
description = "A feature-rich wallpaper manager for Linux/GNOME — pulls images from Wallhaven, Reddit, DeviantArt, Unsplash, Pexels, Pixabay, NASA APOD, and Bing Daily."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["wallpaper", "gnome", "linux", "cli", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
wallpaper = "wallpaper_cli.main:main"

[project.urls]
Homepage = "https://github.com/MLPK-1/wallpaper-cli"
Issues   = "https://github.com/MLPK-1/wallpaper-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wallpaper_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
